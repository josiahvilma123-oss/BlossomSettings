name: BlossomSettings
version: '${project.version}'
main: com.blossom.settings.BlossomSettings
api-version: '1.21'
description: Settings menu, money nametags, Shards, /ps shard shop and DonutSMP-style spawners.
softdepend: [Vault, PlaceholderAPI, BlossomEconomy]

commands:
  settings:
    description: Open the settings menu
    aliases: [toggles, prefs]
    permission: blossomsettings.use
  petalsshop:
    description: Open the Petals shop
    aliases: [ps, petalshop, pshop]
    permission: blossomsettings.petalsshop
  shards:
    description: Check your Shards (admins can give, take, set)
    aliases: [shard]
    permission: blossomsettings.shards
  petals:
    description: Check your Petals (admins can give, take, set)
    aliases: [petal]
    permission: blossomsettings.petals

permissions:
  blossomsettings.use:
    description: Use the settings menu
    default: true
  blossomsettings.reload:
    description: Reload the BlossomSettings config
    default: op
  blossomsettings.petalsshop:
    description: Open the Petals shop
    default: true
  blossomsettings.petals:
    description: Check your Petals balance
    default: true
  blossomsettings.shards:
    description: Check your Shards
    default: true
  blossomsettings.shards.admin:
    description: Give, take, set and check other players' Shards
    default: op
  blossomsettings.spawners.admin:
    description: Open, stack and break anyone's spawner
    default: op
  blossomsettings.petals.admin:
    description: Give, take, set and check other players' Petals
    default: op
