# BlossomSettings config

mob-spawns:
  # Hostile spawns are cancelled when every player within this many blocks has
  # "Mob Spawns" turned OFF. Vanilla spawns mobs up to ~128 blocks from a
  # player, so keep this at 128. If even one nearby player wants mobs, they
  # still spawn (one player can't turn spawns off for everybody).
  radius: 128
  # Which kinds of spawns get blocked. Spawners, spawn eggs and commands are
  # NOT in this list on purpose, so dungeons and your own spawners keep working.
  cancel-reasons:
    - NATURAL
    - JOCKEY
    - MOUNT
    - PATROL

money-nametags:
  # MiniMessage format. <balance> is replaced with the short balance (3.9K, 1.2M...)
  format: "<green>$</green> <white><balance></white>"
  # How far above the player's head the line floats. Raise it if it overlaps
  # the vanilla name, lower it to sit closer.
  height-offset: 0.75
  # How often the tag follows the player (ticks). 2 = smooth and cheap.
  update-interval-ticks: 2
  # How often balances are re-read from your economy plugin (ticks). 20 = 1 sec.
  balance-refresh-ticks: 20
