# BlossomSettings config

mob-spawns:
  # Hostile spawns are cancelled when every player within this many blocks has
  # "Mob Spawns" turned OFF. Vanilla spawns mobs up to ~128 blocks from a
  # player, so keep this at 128. If even one nearby player wants mobs, they
  # still spawn (one player can't turn spawns off for everybody).
  radius: 128
  # Which kinds of spawns get blocked. Spawners, spawn eggs and commands are
  # NOT in this list on purpose, so dungeons and your own spawners keep working.
  cancel-reasons:
    - NATURAL
    - JOCKEY
    - MOUNT
    - PATROL

earn-petals:
  # Petals are the /ps currency. Players earn them by playing (not AFK),
  # killing mobs and players, and from /daily (set in BlossomEconomy).
  playtime:
    # Only minutes where the player actually moved count
    minutes: 10
    amount: 25
  # Mobs from spawners and spawn eggs pay nothing
  kill-hostile-mob:
    amount: 2
  # Killing the same player again within the cooldown pays nothing
  kill-player:
    amount: 30
    same-victim-cooldown-minutes: 30

# /ps prices in Petals. Set a price to 0 to hide that item.
shard-prices:
  blossom_pickaxe: 350        # mines 3x3, lasts 24 hours
  petal_pickaxe: 300          # auto-smelts, lasts 24 hours
  blossom_axe: 250            # chops faster, lasts 24 hours
  cow_spawner: 300
  pig_spawner: 300
  sheep_spawner: 300
  zombie_spawner: 500
  skeleton_spawner: 500
  spider_spawner: 500
  iron_golem_spawner: 900
  blaze_spawner: 1000
  enderman_spawner: 1000

tools:
  # How long the /ps pickaxes and axe last before they disappear
  lifetime-hours: 24
  # How much faster the Blossom Axe breaks blocks (0.5 = 50% faster)
  axe-speed-bonus: 0.5

spawners:
  enabled: true
  # Most spawners you can stack into one block
  max-stack: 64
  # Seconds between drops (before speed upgrades)
  base-interval-seconds: 30
  # Items each spawner in the stack can hold (before storage upgrades)
  base-storage: 512
  base-xp-storage: 1000
  xp-per-mob: 3
  # Picking up a spawner needs a Silk Touch pickaxe (without it, nothing happens)
  needs-silk-touch: true
  upgrades:
    # Shard cost of level 1, 2, 3
    speed-costs: [250, 500, 1000]
    # Drop time is multiplied by this at level 1, 2, 3 (0.5 = twice as fast)
    speed-multipliers: [0.8, 0.65, 0.5]
    storage-costs: [200, 400, 800]
    # Storage is multiplied by this at level 1, 2, 3
    storage-multipliers: [2, 3, 5]
  # What each mob drops per cycle: "ITEM min max [chance%]"
  loot:
    COW: ["BEEF 1 3", "LEATHER 0 2"]
    PIG: ["PORKCHOP 1 3"]
    SHEEP: ["MUTTON 1 2", "WHITE_WOOL 1 1"]
    CHICKEN: ["CHICKEN 1 1", "FEATHER 0 2"]
    ZOMBIE: ["ROTTEN_FLESH 0 2", "IRON_INGOT 1 1 2.5"]
    SKELETON: ["BONE 0 2", "ARROW 0 2"]
    SPIDER: ["STRING 0 2", "SPIDER_EYE 1 1 33"]
    CAVE_SPIDER: ["STRING 0 2", "SPIDER_EYE 1 1 33"]
    CREEPER: ["GUNPOWDER 0 2"]
    IRON_GOLEM: ["IRON_INGOT 3 5", "POPPY 0 2"]
    BLAZE: ["BLAZE_ROD 0 1"]
    ENDERMAN: ["ENDER_PEARL 0 1"]
    MAGMA_CUBE: ["MAGMA_CREAM 0 1"]
    SILVERFISH: []
    WITCH: ["REDSTONE 0 2", "GLOWSTONE_DUST 0 2", "SUGAR 0 2"]

money-nametags:
  # MiniMessage format. <balance> is replaced with the short balance (3.9K, 1.2M...)
  petals-format: "<#FF69B4>✿</#FF69B4> <white><balance></white>"
  # How far above the player's head the line floats. Raise it if it overlaps
  # the vanilla name, lower it to sit closer.
  height-offset: 0.75
  # How often the tag follows the player (ticks). 2 = smooth and cheap.
  update-interval-ticks: 2
  # How often balances are re-read from your economy plugin (ticks). 20 = 1 sec.
  balance-refresh-ticks: 20
